version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cloud_pos_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cloudpossecretpassword
      POSTGRES_DB: cloud_pos
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
